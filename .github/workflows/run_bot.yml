name: Run Gold Bot 24-7

on:
  schedule:
    - cron: '*/5 * * * *'  # يتم فحص السوق وتشغيل البوت كل 5 دقائق تلقائياً
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot script
        run: python main.py
